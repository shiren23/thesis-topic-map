<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毕业论文选题思路 · 交互树状图</title>
<style>
  :root{
    --bg:#eef2f7; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#d7dee8;
    --root-bg:#0f172a; --root-ink:#f8fafc;
    --fact-bg:#e0f2fe; --fact-bd:#38bdf8; --fact-ink:#075985;
    --prin-bg:#fefce8; --prin-bd:#facc15; --prin-ink:#854d0e;
    --dec-bg:#f3e8ff;  --dec-bd:#a855f7;  --dec-ink:#5b21b6;
    --ok-bg:#dcfce7;   --ok-bd:#22c55e;   --ok-ink:#166534;
    --no-bg:#f1f5f9;   --no-bd:#cbd5e1;   --no-ink:#64748b;
    --risk-bg:#fff7ed; --risk-bd:#fb923c; --risk-ink:#9a3412;
    --fin-bg:#ecfeff;  --fin-bd:#06b6d4;  --fin-ink:#155e75;
    --open-bg:#fdf4ff; --open-bd:#e879f9; --open-ink:#86198f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    padding:14px 22px 12px; background:linear-gradient(135deg,#0f172a,#1e3a5f);
    color:#e2e8f0; box-shadow:0 2px 12px rgba(15,23,42,.18); z-index:5;
  }
  header h1{margin:0; font-size:18px; letter-spacing:.5px; color:#fff;}
  header .sub{font-size:12.5px; color:#94a3b8; margin-top:3px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:11px;}
  .btn{
    background:rgba(255,255,255,.10); color:#e2e8f0; border:1px solid rgba(255,255,255,.20);
    border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; transition:.15s;
  }
  .btn:hover{background:rgba(255,255,255,.22);}
  .hint{margin-left:auto; font-size:12px; color:#94a3b8;}

  main{flex:1; display:flex; min-height:0;}
  .viewport{flex:1; position:relative; overflow:hidden; cursor:grab;
    background-color:#f8fafc;
    background-image:radial-gradient(var(--line) 1px, transparent 1px);
    background-size:22px 22px;}
  .viewport.dragging{cursor:grabbing;}
  .canvas{position:absolute; top:0; left:0; transform-origin:0 0;}
  #edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none;}

  .node{
    position:absolute; border-radius:11px; border:1.6px solid var(--line);
    background:#fff; padding:9px 13px; cursor:pointer; overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.08); transition:box-shadow .15s, transform .08s;
    display:flex; flex-direction:column; justify-content:center;
  }
  .node:hover{box-shadow:0 6px 18px rgba(15,23,42,.18); transform:translateY(-1px);}
  .node.selected{outline:3px solid #2563eb; outline-offset:1px; box-shadow:0 8px 22px rgba(37,99,235,.28);}
  .n-label{font-size:13px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .n-sub{font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .toggle{
    position:absolute; right:-9px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; border-radius:50%; border:1.5px solid #cbd5e1; background:#fff;
    color:#475569; font-size:12px; line-height:1; cursor:pointer; padding:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .toggle:hover{background:#2563eb; color:#fff; border-color:#2563eb;}

  .n-root{background:var(--root-bg); border-color:var(--root-bg);}
  .n-root .n-label{color:var(--root-ink); font-size:14px;}
  .n-root .n-sub{color:#cbd5e1;}
  .n-fact{background:var(--fact-bg); border-color:var(--fact-bd);} .n-fact .n-label{color:var(--fact-ink);} .n-fact .n-sub{color:#0c4a6e;}
  .n-prin{background:var(--prin-bg); border-color:var(--prin-bd);} .n-prin .n-label{color:var(--prin-ink);} .n-prin .n-sub{color:#a16207;}
  .n-dec{background:var(--dec-bg); border-color:var(--dec-bd);} .n-dec .n-label{color:var(--dec-ink);} .n-dec .n-sub{color:#7e22ce;}
  .n-ok{background:var(--ok-bg); border-color:var(--ok-bd); border-width:2px;} .n-ok .n-label{color:var(--ok-ink);} .n-ok .n-sub{color:#15803d;}
  .n-no{background:var(--no-bg); border-color:var(--no-bd);} .n-no .n-label{color:var(--no-ink);} .n-no .n-sub{color:#94a3b8;}
  .n-risk{background:var(--risk-bg); border-color:var(--risk-bd);} .n-risk .n-label{color:var(--risk-ink);} .n-risk .n-sub{color:#c2410c;}
  .n-fin{background:var(--fin-bg); border-color:var(--fin-bd);} .n-fin .n-label{color:var(--fin-ink);} .n-fin .n-sub{color:#0e7490;}
  .n-open{background:var(--open-bg); border-color:var(--open-bd);} .n-open .n-label{color:var(--open-ink);} .n-open .n-sub{color:#a21caf;}

  .panel{
    width:400px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:22px 22px 40px;
  }
  .panel .empty{color:var(--muted); font-size:13.5px; margin-top:40px; text-align:center; line-height:1.9;}
  .p-badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 10px; border-radius:999px; letter-spacing:.5px;}
  .b-root{background:#0f172a; color:#fff;}
  .b-fact{background:var(--fact-bg); color:var(--fact-ink);}
  .b-prin{background:var(--prin-bg); color:var(--prin-ink);}
  .b-dec{background:var(--dec-bg); color:var(--dec-ink);}
  .b-ok{background:#bbf7d0; color:var(--ok-ink);}
  .b-no{background:#e2e8f0; color:var(--no-ink);}
  .b-risk{background:var(--risk-bg); color:var(--risk-ink);}
  .b-fin{background:var(--fin-bg); color:var(--fin-ink);}
  .b-open{background:var(--open-bg); color:var(--open-ink);}
  .panel h2{font-size:18px; margin:12px 0 4px; line-height:1.35;}
  .p-sub{color:var(--muted); font-size:12.5px; margin:0 0 12px;}
  .p-desc{font-size:13.5px; line-height:1.75; color:#334155; margin:0 0 16px;}
  .p-block{border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:13px; line-height:1.7;}
  .p-block h4{margin:0 0 7px; font-size:12.5px; letter-spacing:.5px;}
  .p-block ul{margin:0; padding-left:18px;}
  .p-block li{margin:3px 0;}
  .pros{background:#f0fdf4; border:1px solid #bbf7d0;} .pros h4{color:#15803d;}
  .cons{background:#fef2f2; border:1px solid #fecaca;} .cons h4{color:#b91c1c;}
  .p-verdict{background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.7; color:#1e3a8a;}
  .p-children{margin-top:18px;}
  .p-children h4{font-size:12px; color:var(--muted); letter-spacing:.5px; margin:0 0 8px;}
  .chip{display:inline-block; margin:0 6px 6px 0; padding:4px 11px; border-radius:999px; font-size:12px;
    background:#f1f5f9; border:1px solid var(--line); color:#334155; cursor:pointer; transition:.15s;}
  .chip:hover{background:#2563eb; color:#fff; border-color:#2563eb;}
  @media (max-width:820px){
    main{flex-direction:column;}
    .panel{width:auto; border-left:none; border-top:1px solid var(--line); max-height:44vh;}
  }
</style>
</head>

<header>
  <h1>毕业论文选题思路 · 交互树状图</h1>

</main>

/* ============ 布局参数 ============ */
const NODE_W=250, NODE_H=58, GAP_X=92, GAP_Y=14, PAD=48;
const TYPE_LABEL={root:"总览",fact:"素材 / 事实",prin:"原则",dec:"决策",ok:"✓ 选定",no:"未选",risk:"风险",fin:"最终设计",open:"待定"};
const TYPE_CLASS={root:"b-root",fact:"b-fact",prin:"b-prin",dec:"b-dec",ok:"b-ok",no:"b-no",risk:"b-risk",fin:"b-fin",open:"b-open"};

const canvas=document.getElementById("canvas");
const nodesLayer=document.getElementById("nodes");
const svg=document.getElementById("edges");
const viewport=document.getElementById("viewport");
const panel=document.getElementById("panel");

let scale=1, panX=24, panY=24;
let selected=null;
let canvasW=0, canvasH=0;

/* ============ 布局 ============ */
function layout(){
  let cursor=PAD, maxDepth=0;
  (function walk(n,depth){
    n._depth=depth; maxDepth=Math.max(maxDepth,depth);
    const kids=n.collapsed?[]:(n.children||[]);
    if(kids.length===0){ n._y=cursor; cursor+=NODE_H+GAP_Y; }
    else{ kids.forEach(k=>walk(k,depth+1)); n._y=(kids[0]._y+kids[kids.length-1]._y)/2; }
    n._x=PAD+depth*(NODE_W+GAP_X);
  })(DATA,0);
  canvasW=PAD*2+(maxDepth+1)*NODE_W+maxDepth*GAP_X;
  canvasH=cursor-GAP_Y+PAD;
  canvas.style.width=canvasW+"px"; canvas.style.height=canvasH+"px";
  svg.setAttribute("width",canvasW); svg.setAttribute("height",canvasH);
}

/* ============ 渲染 ============ */
function render(){
  layout();
  nodesLayer.innerHTML="";
  const paths=[];
  (function walk(n){
    const el=document.createElement("div");
    el.className="node n-"+n.type+(n===selected?" selected":"");
    el.style.left=n._x+"px"; el.style.top=n._y+"px";
    el.style.width=NODE_W+"px"; el.style.height=NODE_H+"px";
    el.innerHTML='<div class="n-label"></div>'+(n.sub?'<div class="n-sub"></div>':'');
    el.querySelector(".n-label").textContent=n.label;
    if(n.sub) el.querySelector(".n-sub").textContent=n.sub;
    el.addEventListener("click",e=>{e.stopPropagation(); select(n);});
    const kids=n.collapsed?[]:(n.children||[]);
    if((n.children||[]).length>0){
      const t=document.createElement("button");
      t.className="toggle"; t.textContent=n.collapsed?"+":"−";
      t.title=n.collapsed?"展开分支":"折叠分支";
      t.addEventListener("click",e=>{e.stopPropagation(); n.collapsed=!n.collapsed; render();});
      el.appendChild(t);
    }
    nodesLayer.appendChild(el);
    kids.forEach(c=>{
      const px=n._x+NODE_W, py=n._y+NODE_H/2, cx=c._x, cy=c._y+NODE_H/2, mx=(px+cx)/2;
      paths.push('<path d="M '+px+' '+py+' C '+mx+' '+py+', '+mx+' '+cy+', '+cx+' '+cy+'" style="fill:none;stroke:'+edgeColor(c)+';stroke-width:1.6;"/>');
      walk(c);
    });
  })(DATA);
  svg.innerHTML=paths.join("");
}
function edgeColor(n){
  const m={ok:"#22c55e",no:"#cbd5e1",fact:"#7dd3fc",prin:"#fde047",dec:"#d8b4fe",risk:"#fdba74",fin:"#67e8f9",open:"#f5d0fe",root:"#94a3b8"};
  return m[n.type]||"#cbd5e1";
}

/* ============ 详情面板 ============ */
function select(n){
  selected=n; render();
  const badge=TYPE_LABEL[n.type]||"", bc=TYPE_CLASS[n.type]||"";
  let html='<span class="p-badge '+bc+'">'+badge+"</span>";
  html+="<h2></h2>";
  if(n.sub) html+='<p class="p-sub"></p>';
  if(n.desc) html+='<p class="p-desc"></p>';
  if(n.pros&&n.pros.length) html+='<div class="p-block pros"><h4>✓ 优点</h4><ul></ul></div>';
  if(n.cons&&n.cons.length) html+='<div class="p-block cons"><h4>✗ 缺点 / 风险</h4><ul></ul></div>';
  if(n.verdict) html+='<div class="p-verdict"><b>取舍结论：</b><span></span></div>';
  if(n.children&&n.children.length) html+='<div class="p-children"><h4>下级节点（点击跳转）</h4></div>';
  panel.innerHTML=html;
  panel.querySelector("h2").textContent=n.label;
  if(n.sub) panel.querySelector(".p-sub").textContent=n.sub;
  if(n.desc) panel.querySelector(".p-desc").textContent=n.desc;
  if(n.pros&&n.pros.length){const ul=panel.querySelector(".pros ul"); n.pros.forEach(x=>{const li=document.createElement("li"); li.textContent=x; ul.appendChild(li);});}
  if(n.cons&&n.cons.length){const ul=panel.querySelector(".cons ul"); n.cons.forEach(x=>{const li=document.createElement("li"); li.textContent=x; ul.appendChild(li);});}
  if(n.verdict) panel.querySelector(".p-verdict span").textContent=n.verdict;
  if(n.children&&n.children.length){
    const box=panel.querySelector(".p-children");
    n.children.forEach(c=>{const s=document.createElement("span"); s.className="chip"; s.textContent=c.label; s.addEventListener("click",()=>{c.collapsed=false; select(c);}); box.appendChild(s);});
  }
}

/* ============ 平移 / 缩放 ============ */
function applyTransform(){ canvas.style.transform="translate("+panX+"px,"+panY+"px) scale("+scale+")"; }
function zoomAt(mx,my,factor){
  const ns=Math.min(2.6,Math.max(0.18,scale*factor));
  panX=mx-(mx-panX)*(ns/scale); panY=my-(my-panY)*(ns/scale); scale=ns; applyTransform();
}
function fit(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  scale=Math.min(vw/canvasW, vh/canvasH, 1.15);
  scale=Math.max(0.18,scale*0.94);
  panX=(vw-canvasW*scale)/2; panY=(vh-canvasH*scale)/2; applyTransform();
}
viewport.addEventListener("wheel",e=>{e.preventDefault(); const r=viewport.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015));},{passive:false});
let drag=null;
viewport.addEventListener("mousedown",e=>{ if(e.target.closest(".node")||e.target.closest(".toggle")) return; drag={x:e.clientX,y:e.clientY,px:panX,py:panY}; viewport.classList.add("dragging"); });
window.addEventListener("mousemove",e=>{ if(!drag) return; panX=drag.px+(e.clientX-drag.x); panY=drag.py+(e.clientY-drag.y); applyTransform(); });
window.addEventListener("mouseup",()=>{ drag=null; viewport.classList.remove("dragging"); });

document.getElementById("zoomIn").onclick=()=>zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,1.2);
document.getElementById("zoomOut").onclick=()=>zoomAt(viewport.clientWidth/2,viewport.clientHeight/2,1/1.2);
document.getElementById("fitBtn").onclick=fit;
document.getElementById("expandAll").onclick=()=>{(function w(n){n.collapsed=false;(n.children||[]).forEach(w);})(DATA); render();};
document.getElementById("collapseAll").onclick=()=>{(function w(n){n.collapsed=(n._depth||0)>=2;(n.children||[]).forEach(w);})(DATA); render(); fit();};

/* ============ 初始化 ============ */
render();
select(DATA);
if(canvasH>viewport.clientHeight*0.9||canvasW>viewport.clientWidth*0.9){ fit(); }
</script>
</body>
